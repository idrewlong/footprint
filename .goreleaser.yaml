# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: footprint

before:
  hooks:
    - go mod tidy
    - go test -count=1 ./...

# Static, reproducible builds: no cgo, no local paths, no build ID, and file
# times pinned to the commit. Rebuilding a tag with the same Go version
# gives byte-identical binaries (see README, "Verifying a release").
builds:
  - id: footprint
    main: ./cmd/footprint
    binary: footprint
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w -buildid=]
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: footprint-mcp
    main: ./cmd/footprint-mcp
    binary: footprint-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: [-s -w -buildid=]
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: footprint
    ids: [footprint, footprint-mcp]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

# One SPDX SBOM per archive, generated by syft.
sboms:
  - artifacts: archive

# Keyless cosign signature over the checksum file, which covers every
# archive and SBOM. The identity is this repository's release workflow.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

homebrew_casks:
  - name: footprint
    binaries: [footprint, footprint-mcp]
    repository:
      owner: idrewlong
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/idrewlong/footprint
    description: Local OSINT tool that reports which sites have an account for an email address
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    # The binaries are not notarized, so drop macOS quarantine on install.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/footprint"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/footprint-mcp"]
          end

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: |
    Verify this release: see "Verifying a release" in the README.
